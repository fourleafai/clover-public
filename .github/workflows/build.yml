name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build dist bundles
        run: npm run build
      - name: CLI smoke test
        run: |
          node bin/four-leaf-coach.js --help
          node bin/four-leaf-coach.js list
      - name: Pack sanity check
        run: npm pack --dry-run
